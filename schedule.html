<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<title>イベントスケジュール</title>

<style>
:root{
  --bg:#f4f4f4;
  --card:#ffffff;
  --soft:#f7f7f7;
  --line:#dddddd;
  --text:#111111;
  --sub:#737373;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",
              "Yu Gothic",Meiryo,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}

.page{
  width:100%;
  max-width:720px;
  margin:0 auto;
  min-height:100vh;
  padding:
    max(28px, env(safe-area-inset-top))
    16px
    calc(36px + env(safe-area-inset-bottom));
}

/* ===== Header ===== */
.hero{
  text-align:center;
  padding:6px 6px 20px;
}
.event-name{
  margin:0;
  font-size:36px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:-0.03em;
  word-break:break-word;
}
.hero-sub{
  margin-top:8px;
  color:var(--sub);
  font-size:15px;
  font-weight:700;
}

/* ===== DAY tabs ===== */
.day-tabs{
  display:grid;
  gap:8px;
  margin-bottom:18px;
}
.day-tabs.cols-1{grid-template-columns:1fr}
.day-tabs.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.day-tabs.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.day-tabs.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.day-tabs.cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}

.day-tab{
  appearance:none;
  border:1px solid #d2d2d2;
  border-radius:16px;
  background:#fff;
  color:#222;
  min-height:68px;
  padding:9px 5px 8px;
  cursor:pointer;
  transition:transform .08s ease, background .15s ease, color .15s ease;
}
.day-tab:active{transform:scale(.985)}
.day-tab.active{
  background:#111;
  color:#fff;
  border-color:#111;
}
.day-tab .label{
  display:block;
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
}
.day-tab .date{
  display:block;
  margin-top:4px;
  font-size:12px;
  font-weight:800;
  opacity:.72;
  white-space:nowrap;
}

/* ===== Main card ===== */
.schedule-wrap{
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.055);
}
.schedule-head{
  padding:24px 20px 16px;
  background:linear-gradient(180deg,#f0f0f0 0%,#f8f8f8 100%);
}
.day-title{
  margin:0;
  font-size:29px;
  font-weight:900;
  letter-spacing:-.03em;
}
.section-title{
  margin-top:7px;
  color:#555;
  font-size:15px;
  font-weight:800;
}

.schedule-body{
  padding:16px 14px 18px;
}
.schedule-list{
  display:grid;
  gap:10px;
}

/* ===== Schedule item ===== */
.schedule-row{
  display:grid;
  grid-template-columns:92px 1fr;
  min-height:76px;
  border:1px solid #e1e1e1;
  background:var(--soft);
  border-radius:17px;
  overflow:hidden;
}
.time{
  display:flex;
  align-items:center;
  justify-content:center;
  border-right:1px solid #d8d8d8;
  background:#f5f5f5;
  padding:12px 8px;
  font-size:21px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}
.detail{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
  padding:13px 16px;
}
.item-title{
  font-size:18px;
  line-height:1.35;
  font-weight:900;
  word-break:break-word;
}
.item-note{
  margin-top:5px;
  color:var(--sub);
  font-size:14px;
  line-height:1.45;
  font-weight:600;
  word-break:break-word;
}

.empty-state{
  display:none;
  margin:4px 0;
  padding:42px 18px;
  border:1px dashed #d7d7d7;
  border-radius:17px;
  color:#8a8a8a;
  text-align:center;
  background:#fafafa;
  font-size:14px;
  line-height:1.75;
}
.footer{
  margin-top:16px;
  color:#a0a0a0;
  font-size:11px;
  text-align:center;
}

/* 5日表示でもスマホで読めるように調整 */
@media(max-width:560px){
  .day-tabs.cols-4,
  .day-tabs.cols-5{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}
@media(max-width:430px){
  .page{padding-left:12px;padding-right:12px}
  .event-name{font-size:32px}
  .day-tabs{gap:7px}
  .day-tab{min-height:64px;border-radius:15px}
  .day-tab .label{font-size:14px}
  .day-tab .date{font-size:11px}
  .schedule-head{padding:21px 18px 14px}
  .day-title{font-size:26px}
  .schedule-body{padding:13px 10px 15px}
  .schedule-row{
    grid-template-columns:78px 1fr;
    min-height:72px;
    border-radius:15px;
  }
  .time{font-size:19px}
  .detail{padding:12px 13px}
  .item-title{font-size:17px}
  .item-note{font-size:13px}
}
</style>
</head>

<body>
<div class="page">

  <header class="hero">
    <h1 id="eventName" class="event-name">SBCMT</h1>
    <div class="hero-sub">イベントスケジュール</div>
  </header>

  <nav id="dayTabs" class="day-tabs" aria-label="日程切り替え"></nav>

  <main class="schedule-wrap">
    <section class="schedule-head">
      <h2 id="dayTitle" class="day-title"></h2>
      <div class="section-title">スケジュール</div>
    </section>

    <section class="schedule-body">
      <div id="scheduleList" class="schedule-list"></div>
      <div id="emptyState" class="empty-state">
        この日のスケジュールはまだ登録されていません。
      </div>
    </section>
  </main>

  <div class="footer">最新のスケジュールを表示しています</div>

</div>

<script>
/*
  現在は表示確認用データです。
  次の工程で管理者画面/Firebaseと接続します。

  本番仕様：
  ・開催日数を 1〜5日から選択
  ・選んだ日数だけDAYタブを表示
  ・各DAY 最大20件
  ・1件につき「開始時間 / 内容 / 備考」
  ・日数を減らしてもFirebase上の未表示DAYデータは保持する予定
*/

const scheduleData = {
  eventName: "SBCMT",

  // ★ここが開催日数。1〜5で変更可能
  dayCount: 2,

  days: [
    {
      label: "DAY1",
      date: "11月21日",
      items: [
        { time: "8:00",  title: "入場開始", note: "" },
        { time: "10:00", title: "受付開始", note: "本部幕にて受付" },
        { time: "14:00", title: "開会式", note: "椅子と飲み物持参" },
        { time: "14:20", title: "ビンゴ大会", note: "" },
        { time: "15:10", title: "じゃんけん大会", note: "" },
        { time: "16:00", title: "フリータイム", note: "" },
        { time: "22:00", title: "クワイアットタイム", note: "" }
      ]
    },
    {
      label: "DAY2",
      date: "11月22日",
      items: [
        { time: "15:30", title: "完全撤収", note: "" }
      ]
    },
    {
      label: "DAY3",
      date: "11月23日",
      items: []
    },
    {
      label: "DAY4",
      date: "11月24日",
      items: []
    },
    {
      label: "DAY5",
      date: "11月25日",
      items: []
    }
  ]
};

let activeDayIndex = 0;

const eventNameEl    = document.getElementById("eventName");
const dayTabsEl      = document.getElementById("dayTabs");
const dayTitleEl     = document.getElementById("dayTitle");
const scheduleListEl = document.getElementById("scheduleList");
const emptyStateEl   = document.getElementById("emptyState");

const safeDayCount = Math.max(1, Math.min(5, Number(scheduleData.dayCount) || 1));
const visibleDays = scheduleData.days.slice(0, safeDayCount);

eventNameEl.textContent = scheduleData.eventName || "イベント";

function renderTabs(){
  dayTabsEl.innerHTML = "";
  dayTabsEl.className = `day-tabs cols-${safeDayCount}`;

  visibleDays.forEach((day,index)=>{
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "day-tab" + (index === activeDayIndex ? " active" : "");

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = day.label || `DAY${index+1}`;

    const date = document.createElement("span");
    date.className = "date";
    date.textContent = day.date || "日付未設定";

    btn.appendChild(label);
    btn.appendChild(date);

    btn.addEventListener("click",()=>{
      activeDayIndex = index;
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    });

    dayTabsEl.appendChild(btn);
  });
}

function renderSchedule(){
  const day = visibleDays[activeDayIndex];

  if(!day){
    dayTitleEl.textContent = "";
    scheduleListEl.innerHTML = "";
    emptyStateEl.style.display = "block";
    return;
  }

  dayTitleEl.textContent = day.date
    ? `${day.label}  ${day.date}`
    : day.label;

  scheduleListEl.innerHTML = "";

  const items = Array.isArray(day.items)
    ? day.items.slice(0,20)
    : [];

  if(items.length === 0){
    emptyStateEl.style.display = "block";
    return;
  }

  emptyStateEl.style.display = "none";

  items.forEach(item=>{
    const row = document.createElement("div");
    row.className = "schedule-row";

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = item.time || "";

    const detail = document.createElement("div");
    detail.className = "detail";

    const title = document.createElement("div");
    title.className = "item-title";
    title.textContent = item.title || "";
    detail.appendChild(title);

    if(item.note){
      const note = document.createElement("div");
      note.className = "item-note";
      note.textContent = item.note;
      detail.appendChild(note);
    }

    row.appendChild(time);
    row.appendChild(detail);
    scheduleListEl.appendChild(row);
  });
}

function render(){
  renderTabs();
  renderSchedule();
}

render();
</script>
</body>
</html>
