<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>イベントスケジュール</title>

<style>
:root{
  --bg:#f4f4f4;
  --card:#ffffff;
  --soft:#f7f7f7;
  --line:#dddddd;
  --text:#111111;
  --sub:#737373;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",
              "Yu Gothic",Meiryo,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

button{font:inherit}

.page{
  width:100%;
  max-width:720px;
  margin:0 auto;
  min-height:100vh;
  padding:
    max(28px,env(safe-area-inset-top))
    16px
    calc(36px + env(safe-area-inset-bottom));
}

/* ===== HEADER ===== */
.hero{
  text-align:center;
  padding:6px 6px 20px;
}

.event-name{
  margin:0;
  font-size:36px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:-.03em;
  word-break:break-word;
}

.hero-sub{
  margin-top:8px;
  color:var(--sub);
  font-size:15px;
  font-weight:700;
}

/* ===== DAY TABS ===== */
.day-tabs{
  display:grid;
  gap:8px;
  margin-bottom:18px;
}

.day-tabs.cols-1{grid-template-columns:1fr}
.day-tabs.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.day-tabs.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.day-tabs.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.day-tabs.cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}

.day-tab{
  appearance:none;
  border:1px solid #d2d2d2;
  border-radius:16px;
  background:#fff;
  color:#222;
  min-height:68px;
  padding:9px 5px 8px;
  cursor:pointer;
  transition:transform .08s ease,background .15s ease,color .15s ease;
}

.day-tab:active{
  transform:scale(.985);
}

.day-tab.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.day-tab .label{
  display:block;
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
}

.day-tab .date{
  display:block;
  margin-top:4px;
  font-size:12px;
  font-weight:800;
  opacity:.72;
  white-space:nowrap;
}

/* ===== MAIN CARD ===== */
.schedule-wrap{
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.055);
}

.schedule-head{
  padding:24px 20px 16px;
  background:linear-gradient(180deg,#f0f0f0 0%,#f8f8f8 100%);
}

.day-title{
  margin:0;
  font-size:29px;
  font-weight:900;
  letter-spacing:-.03em;
}

.section-title{
  margin-top:7px;
  color:#555;
  font-size:15px;
  font-weight:800;
}

.schedule-body{
  padding:16px 14px 18px;
}

.schedule-list{
  display:grid;
  gap:10px;
}

/* ===== SCHEDULE ROW ===== */
.schedule-row{
  display:grid;
  grid-template-columns:92px 1fr;
  min-height:76px;
  border:1px solid #e1e1e1;
  background:var(--soft);
  border-radius:17px;
  overflow:hidden;
}

.time{
  display:flex;
  align-items:center;
  justify-content:center;
  border-right:1px solid #d8d8d8;
  background:#f5f5f5;
  padding:12px 8px;
  font-size:21px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

.detail{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
  padding:13px 16px;
}

.item-title{
  font-size:18px;
  line-height:1.35;
  font-weight:900;
  word-break:break-word;
}

.item-note{
  margin-top:5px;
  color:var(--sub);
  font-size:14px;
  line-height:1.45;
  font-weight:600;
  word-break:break-word;
}

/* ===== STATES ===== */
.state-card{
  background:#fff;
  border-radius:22px;
  padding:34px 20px;
  text-align:center;
  box-shadow:0 6px 24px rgba(0,0,0,.055);
}

.state-title{
  font-size:20px;
  font-weight:900;
}

.state-text{
  margin-top:10px;
  color:#777;
  font-size:13px;
  line-height:1.7;
}

.spinner{
  width:34px;
  height:34px;
  margin:20px auto 0;
  border:3px solid #ddd;
  border-top-color:#111;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.empty-state{
  display:none;
  margin:4px 0;
  padding:42px 18px;
  border:1px dashed #d7d7d7;
  border-radius:17px;
  color:#8a8a8a;
  text-align:center;
  background:#fafafa;
  font-size:14px;
  line-height:1.75;
}

.footer{
  margin-top:16px;
  color:#a0a0a0;
  font-size:11px;
  text-align:center;
}

.hidden{
  display:none !important;
}

/* ===== MOBILE ===== */
@media(max-width:560px){
  .day-tabs.cols-4,
  .day-tabs.cols-5{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:430px){
  .page{
    padding-left:12px;
    padding-right:12px;
  }

  .event-name{
    font-size:32px;
  }

  .day-tabs{
    gap:7px;
  }

  .day-tab{
    min-height:64px;
    border-radius:15px;
  }

  .day-tab .label{
    font-size:14px;
  }

  .day-tab .date{
    font-size:11px;
  }

  .schedule-head{
    padding:21px 18px 14px;
  }

  .day-title{
    font-size:26px;
  }

  .schedule-body{
    padding:13px 10px 15px;
  }

  .schedule-row{
    grid-template-columns:78px 1fr;
    min-height:72px;
    border-radius:15px;
  }

  .time{
    font-size:19px;
  }

  .detail{
    padding:12px 13px;
  }

  .item-title{
    font-size:17px;
  }

  .item-note{
    font-size:13px;
  }
}
</style>
</head>

<body>
<div class="page">

  <!-- LOADING -->
  <div id="loadingState" class="state-card">
    <div class="state-title">スケジュールを読み込んでいます</div>
    <div class="state-text">そのまま少しお待ちください。</div>
    <div class="spinner"></div>
  </div>

  <!-- ERROR -->
  <div id="errorState" class="state-card hidden">
    <div id="errorTitle" class="state-title">スケジュールを表示できません</div>
    <div id="errorText" class="state-text">
      URLをご確認いただくか、イベント主催者へお問い合わせください。
    </div>
  </div>

  <!-- SCHEDULE -->
  <div id="schedulePage" class="hidden">

    <header class="hero">
      <h1 id="eventName" class="event-name">イベント</h1>
      <div class="hero-sub">イベントスケジュール</div>
    </header>

    <nav id="dayTabs" class="day-tabs" aria-label="日程切り替え"></nav>

    <main class="schedule-wrap">
      <section class="schedule-head">
        <h2 id="dayTitle" class="day-title"></h2>
        <div class="section-title">スケジュール</div>
      </section>

      <section class="schedule-body">
        <div id="scheduleList" class="schedule-list"></div>

        <div id="emptyState" class="empty-state">
          この日のスケジュールはまだ登録されていません。
        </div>
      </section>
    </main>

    <div class="footer">最新のスケジュールを表示しています</div>

  </div>

</div>

<script>
/* =========================
   PUBLIC SCHEDULE VIEW
========================= */

const GET_PUBLIC_SCHEDULE_URL =
  "https://asia-northeast1-event-checkin-app-987b3.cloudfunctions.net/getPublicSchedule";

let scheduleData = null;
let activeDayIndex = 0;

const loadingState =
  document.getElementById("loadingState");

const errorState =
  document.getElementById("errorState");

const errorTitle =
  document.getElementById("errorTitle");

const errorText =
  document.getElementById("errorText");

const schedulePage =
  document.getElementById("schedulePage");

const eventNameEl =
  document.getElementById("eventName");

const dayTabsEl =
  document.getElementById("dayTabs");

const dayTitleEl =
  document.getElementById("dayTitle");

const scheduleListEl =
  document.getElementById("scheduleList");

const emptyStateEl =
  document.getElementById("emptyState");


function showError(title, text) {

  loadingState.classList.add("hidden");
  schedulePage.classList.add("hidden");

  errorTitle.textContent =
    title;

  errorText.textContent =
    text;

  errorState.classList.remove("hidden");
}


function formatDisplayDate(value) {

  if (!value) {
    return "";
  }

  const parts =
    String(value).split("-");

  if (parts.length !== 3) {
    return value;
  }

  return (
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );
}


function normalizeSchedule(value) {

  if (
    !value ||
    typeof value !== "object"
  ) {
    return null;
  }

  const dayCount =
    Math.max(
      1,
      Math.min(
        5,
        Number(value.dayCount) || 1
      )
    );

  const sourceDays =
    Array.isArray(value.days)
      ? value.days
      : [];

  const days =
    Array.from(
      { length: dayCount },
      (_, index) => {

        const sourceDay =
          sourceDays[index] &&
          typeof sourceDays[index] === "object"
            ? sourceDays[index]
            : {};

        const sourceItems =
          Array.isArray(sourceDay.items)
            ? sourceDay.items
            : [];

        return {
          label:
            sourceDay.label ||
            ("DAY" + (index + 1)),

          date:
            typeof sourceDay.date === "string"
              ? sourceDay.date
              : "",

          items:
            sourceItems
              .slice(0,20)
              .map(item => ({
                time:
                  typeof item?.time === "string"
                    ? item.time
                    : "",

                title:
                  typeof item?.title === "string"
                    ? item.title
                    : "",

                note:
                  typeof item?.note === "string"
                    ? item.note
                    : ""
              }))
        };
      }
    );

  return {
    eventName:
      String(
        value.eventName ||
        "イベント"
      ),

    dayCount,
    days,

    updatedAt:
      Number(value.updatedAt) || 0
  };
}


function renderTabs() {

  const days =
    scheduleData.days;

  const count =
    days.length;

  dayTabsEl.innerHTML =
    "";

  dayTabsEl.className =
    "day-tabs cols-" + count;

  days.forEach(
    (day,index) => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "day-tab" +
        (
          index === activeDayIndex
            ? " active"
            : ""
        );

      const label =
        document.createElement(
          "span"
        );

      label.className =
        "label";

      label.textContent =
        day.label ||
        ("DAY" + (index + 1));

      const date =
        document.createElement(
          "span"
        );

      date.className =
        "date";

      date.textContent =
        formatDisplayDate(
          day.date
        ) ||
        "日付未設定";

      button.appendChild(
        label
      );

      button.appendChild(
        date
      );

      button.addEventListener(
        "click",
        () => {

          activeDayIndex =
            index;

          render();

          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        }
      );

      dayTabsEl.appendChild(
        button
      );

    }
  );
}


function renderSchedule() {

  const day =
    scheduleData.days[
      activeDayIndex
    ];

  if (!day) {
    return;
  }

  const displayDate =
    formatDisplayDate(
      day.date
    );

  dayTitleEl.textContent =
    displayDate
      ? `${day.label}  ${displayDate}`
      : day.label;

  scheduleListEl.innerHTML =
    "";

  const items =
    Array.isArray(day.items)
      ? day.items
      : [];

  if (!items.length) {

    emptyStateEl.style.display =
      "block";

    return;
  }

  emptyStateEl.style.display =
    "none";

  items.forEach(
    item => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "schedule-row";

      const time =
        document.createElement(
          "div"
        );

      time.className =
        "time";

      time.textContent =
        item.time || "";

      const detail =
        document.createElement(
          "div"
        );

      detail.className =
        "detail";

      const title =
        document.createElement(
          "div"
        );

      title.className =
        "item-title";

      title.textContent =
        item.title || "";

      detail.appendChild(
        title
      );

      if (item.note) {

        const note =
          document.createElement(
            "div"
          );

        note.className =
          "item-note";

        note.textContent =
          item.note;

        detail.appendChild(
          note
        );
      }

      row.appendChild(
        time
      );

      row.appendChild(
        detail
      );

      scheduleListEl.appendChild(
        row
      );

    }
  );
}


function render() {

  eventNameEl.textContent =
    scheduleData.eventName;

  renderTabs();
  renderSchedule();
}


async function loadPublicSchedule() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const publicId =
    String(
      params.get("s") || ""
    ).trim();

  if (!publicId) {

    showError(
      "スケジュールURLが正しくありません",
      "イベント主催者から案内されたURLまたはQRコードから開いてください。"
    );

    return;
  }

  try {

    const url =
      new URL(
        GET_PUBLIC_SCHEDULE_URL
      );

    url.searchParams.set(
      "s",
      publicId
    );

    url.searchParams.set(
      "_t",
      Date.now().toString()
    );

    const response =
      await fetch(
        url.toString(),
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if (response.status === 404) {

      showError(
        "スケジュールが見つかりません",
        "このスケジュールはまだ公開されていないか、URLが無効になっています。"
      );

      return;
    }

    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );
    }

    const result =
      await response.json();

    if (
      !result.ok ||
      !result.schedule
    ) {

      throw new Error(
        "Invalid schedule response"
      );
    }

    scheduleData =
      normalizeSchedule(
        result.schedule
      );

    if (!scheduleData) {

      throw new Error(
        "Schedule data is invalid"
      );
    }

    activeDayIndex =
      0;

    render();

    loadingState.classList.add(
      "hidden"
    );

    errorState.classList.add(
      "hidden"
    );

    schedulePage.classList.remove(
      "hidden"
    );

  } catch (error) {

    console.error(
      "Schedule load error:",
      error
    );

    showError(
      "スケジュールを読み込めませんでした",
      "通信状態をご確認のうえ、もう一度ページを開いてください。"
    );
  }
}


loadPublicSchedule();
</script>
</body>
</html>
