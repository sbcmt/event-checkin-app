<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>イベント受付管理</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f3f3f3;color:#111}
button,input{font:inherit}button{cursor:pointer}
.app{width:100%;max-width:680px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.brand{text-align:center;margin:14px 0 26px}.brandTitle{margin:0;font-size:38px;font-weight:900}.brandSub{margin-top:5px;color:#777;font-size:14px}
.screen{display:none}.screen.active{display:block}
.card{background:white;border-radius:22px;padding:22px 18px;box-shadow:0 5px 20px rgba(0,0,0,.07)}
.pageTitle{margin:0;text-align:center;font-size:28px;font-weight:900}
.pageDescription{margin:8px 0 22px;text-align:center;color:#777;font-size:14px;line-height:1.6}
.field{margin-top:15px}.fieldLabel{display:block;margin:0 0 7px 3px;color:#555;font-size:13px;font-weight:700}
.input{width:100%;padding:15px;border:1px solid #ccc;border-radius:13px;background:white;color:#111;font-size:16px;outline:none}.input:focus{border-color:#111}
.primaryButton{width:100%;margin-top:18px;padding:17px;border:none;border-radius:15px;background:#111;color:white;font-size:18px;font-weight:900}
.secondaryButton{width:100%;margin-top:10px;padding:15px;border:1px solid #aaa;border-radius:14px;background:white;color:#444;font-size:15px;font-weight:700}
.linkButton{width:100%;margin-top:12px;padding:8px;border:none;background:transparent;color:#444;font-size:14px;font-weight:700;text-decoration:underline}
.notice{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#fdeaea;color:#b00000;text-align:center;font-size:13px;font-weight:700;white-space:pre-wrap}
.topBar{display:flex;align-items:center;gap:10px;margin-bottom:16px}.topBarTitle{flex:1;margin:0;text-align:center;font-size:25px;font-weight:900}
.userInfo{margin-bottom:14px;padding:12px 14px;border-radius:14px;background:white;color:#666;font-size:13px;text-align:center}
.emptyState{margin-top:16px;padding:34px 18px;border-radius:18px;background:white;text-align:center;color:#777;line-height:1.7}
@media(max-width:380px){.brandTitle{font-size:32px}.pageTitle{font-size:25px}}
</style>
</head>

<body>
<div class="app">

  <div class="brand">
    <h1 class="brandTitle">CHECK-IN</h1>
    <div class="brandSub">イベント受付管理</div>
  </div>

  <section id="loginScreen" class="screen active">
    <div class="card">
      <h2 class="pageTitle">スタッフログイン</h2>
      <div class="pageDescription">登録済みのメールアドレスとパスワードでログインしてください</div>

      <div class="field">
        <label class="fieldLabel" for="loginEmail">メールアドレス</label>
        <input id="loginEmail" class="input" type="email" autocomplete="username" placeholder="example@email.com">
      </div>

      <div class="field">
        <label class="fieldLabel" for="loginPassword">パスワード</label>
        <input id="loginPassword" class="input" type="password" autocomplete="current-password" placeholder="パスワード">
      </div>

      <button id="loginButton" class="primaryButton">ログイン</button>
      <button id="openRegisterButton" class="linkButton">初めての方はこちら：新規アカウント登録</button>
      <div id="loginError" class="notice"></div>
    </div>
  </section>

  <section id="registerScreen" class="screen">
    <div class="card">
      <h2 class="pageTitle">新規アカウント登録</h2>
      <div class="pageDescription">利用するメールアドレスとパスワードを登録してください</div>

      <div class="field">
        <label class="fieldLabel" for="registerEmail">メールアドレス</label>
        <input id="registerEmail" class="input" type="email" autocomplete="email" placeholder="example@email.com">
      </div>

      <div class="field">
        <label class="fieldLabel" for="registerPassword">パスワード</label>
        <input id="registerPassword" class="input" type="password" autocomplete="new-password" placeholder="6文字以上">
      </div>

      <div class="field">
        <label class="fieldLabel" for="registerPasswordConfirm">パスワード確認</label>
        <input id="registerPasswordConfirm" class="input" type="password" autocomplete="new-password" placeholder="同じパスワードをもう一度">
      </div>

      <button id="registerButton" class="primaryButton">アカウントを作成</button>
      <button id="backToLoginButton" class="secondaryButton">ログイン画面に戻る</button>
      <div id="registerError" class="notice"></div>
    </div>
  </section>

  <section id="eventListScreen" class="screen">
    <div class="topBar"><h2 class="topBarTitle">イベント一覧</h2></div>
    <div id="userInfo" class="userInfo"></div>

    <button id="newEventButton" class="primaryButton">＋ 新しいイベントを登録</button>

    <div class="emptyState">
      ここに、このアカウントで作成したイベントを表示します。<br>
      イベント保存機能は次の工程でFirebaseに接続します。
    </div>

    <button id="logoutButton" class="secondaryButton">ログアウト</button>
  </section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAeHpco02MEDN58bXkhHcDof1kVFWQU0U",
  authDomain: "event-checkin-app-987b3.firebaseapp.com",
  projectId: "event-checkin-app-987b3",
  storageBucket: "event-checkin-app-987b3.firebasestorage.app",
  messagingSenderId: "403667082231",
  appId: "1:403667082231:web:7325e9a85e9a887196acf2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

function clearMessage(id) {
  const box = document.getElementById(id);
  box.style.display = "none";
  box.textContent = "";
}

function showError(elementId, error) {
  const box = document.getElementById(elementId);

  const code =
    error && error.code
      ? error.code
      : "unknown-error";

  const messages = {
    "auth/email-already-in-use":
      "このメールアドレスはすでに登録されています。",

    "auth/invalid-email":
      "メールアドレスの形式を確認してください。",

    "auth/weak-password":
      "パスワードは6文字以上にしてください。",

    "auth/invalid-credential":
      "メールアドレスまたはパスワードが一致しません。",

    "auth/user-disabled":
      "このアカウントは無効になっています。",

    "auth/too-many-requests":
      "ログイン試行が多いため一時的に制限されています。",

    "auth/network-request-failed":
      "通信エラーです。インターネット接続を確認してください。",

    "auth/operation-not-allowed":
      "Firebaseのメール・パスワード認証が有効になっていません。",

    "auth/unauthorized-domain":
      "このWebサイトのドメインがFirebaseで許可されていません。",

    "auth/api-key-not-valid.-please-pass-a-valid-api-key.":
      "FirebaseのAPIキーが正しくありません。"
  };

  box.textContent =
    (messages[code] || "Firebaseエラーが発生しました。") +
    "\n\nエラーコード：" +
    code;

  box.style.display = "block";
}

document.getElementById("openRegisterButton").addEventListener("click", () => {
  clearMessage("loginError");
  showScreen("registerScreen");
});

document.getElementById("backToLoginButton").addEventListener("click", () => {
  clearMessage("registerError");
  showScreen("loginScreen");
});

document.getElementById("registerButton").addEventListener("click", async () => {
  clearMessage("registerError");

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const confirmPassword =
    document.getElementById("registerPasswordConfirm").value;

  if (!email || !password || !confirmPassword) {
    const box = document.getElementById("registerError");
    box.textContent = "すべて入力してください。";
    box.style.display = "block";
    return;
  }

  if (password !== confirmPassword) {
    const box = document.getElementById("registerError");
    box.textContent = "確認用パスワードが一致していません。";
    box.style.display = "block";
    return;
  }

  try {
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );
  } catch (error) {
    console.error(error);
    showError("registerError", error);
  }
});

document.getElementById("loginButton").addEventListener("click", async () => {
  clearMessage("loginError");

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if (!email || !password) {
    const box = document.getElementById("loginError");
    box.textContent = "メールアドレスとパスワードを入力してください。";
    box.style.display = "block";
    return;
  }

  try {
    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    document.getElementById("loginPassword").value = "";
  } catch (error) {
    console.error(error);
    showError("loginError", error);
  }
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  await signOut(auth);
});

document.getElementById("newEventButton").addEventListener("click", () => {
  alert("次の工程でイベント登録画面とFirebase保存を接続します。");
});

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById("userInfo").textContent =
      "ログイン中：" + user.email;

    showScreen("eventListScreen");
  } else {
    showScreen("loginScreen");
  }
});
</script>

</body>
</html>
